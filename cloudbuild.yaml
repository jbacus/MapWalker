steps:
# Create a service account for the backend (idempotent)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
  - '-c'
  - |
    gcloud iam service-accounts describe map-art-backend-sa@$PROJECT_ID.iam.gserviceaccount.com --project=$PROJECT_ID 2>/dev/null || \
    gcloud iam service-accounts create map-art-backend-sa \
      --display-name="Map Art Backend Service Account" \
      --project=$PROJECT_ID \
      --quiet

# Grant the service account access to the secrets (idempotent)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
  - '-c'
  - |
    gcloud secrets add-iam-policy-binding MAPS_API \
      --member=serviceAccount:map-art-backend-sa@$PROJECT_ID.iam.gserviceaccount.com \
      --role=roles/secretmanager.secretAccessor \
      --project=$PROJECT_ID \
      --condition=None || true

    gcloud secrets add-iam-policy-binding W3W_API_KEY \
      --member=serviceAccount:map-art-backend-sa@$PROJECT_ID.iam.gserviceaccount.com \
      --role=roles/secretmanager.secretAccessor \
      --project=$PROJECT_ID \
      --condition=None || true

    gcloud secrets add-iam-policy-binding CLAUDE_API_KEY \
      --member=serviceAccount:map-art-backend-sa@$PROJECT_ID.iam.gserviceaccount.com \
      --role=roles/secretmanager.secretAccessor \
      --project=$PROJECT_ID \
      --condition=None || true

# Build and push the backend image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/map-art-app/backend:$BUILD_ID', './backend']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/map-art-app/backend:$BUILD_ID']

# Build and push the frontend image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '--no-cache', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/map-art-app/frontend:$BUILD_ID', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/map-art-app/frontend:$BUILD_ID']

# Deploy the backend to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'map-art-backend'
  - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/map-art-app/backend:$BUILD_ID'
  - '--region=us-central1'
  - '--platform=managed'
  - '--allow-unauthenticated'
  - '--service-account=map-art-backend-sa@$PROJECT_ID.iam.gserviceaccount.com'
  - '--set-env-vars=SECRET_NAME=projects/$PROJECT_ID/secrets/MAPS_API/versions/latest'

# Get the backend URL
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
  - '-c'
  - |
    gcloud run services describe map-art-backend \
      --region=us-central1 \
      --format='value(status.url)' \
      --project=$PROJECT_ID > /workspace/backend_url.txt
    echo "Backend URL: $(cat /workspace/backend_url.txt)"

# Deploy the frontend to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
  - '-c'
  - |
    BACKEND_URL=$(cat /workspace/backend_url.txt)
    gcloud run deploy map-art-frontend \
      --image=us-central1-docker.pkg.dev/$PROJECT_ID/map-art-app/frontend:$BUILD_ID \
      --region=us-central1 \
      --platform=managed \
      --allow-unauthenticated \
      --set-env-vars=BACKEND_URL=$${BACKEND_URL}

images:
- 'us-central1-docker.pkg.dev/$PROJECT_ID/map-art-app/backend:$BUILD_ID'
- 'us-central1-docker.pkg.dev/$PROJECT_ID/map-art-app/frontend:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
